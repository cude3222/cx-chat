<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cx-Chat</title>
    <style>
        :root { --bg: #121214; --panel: #1a1a1e; --text: #e2e8f0; --accent: #00ff66; }
        body { font-family: monospace; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 95vh; margin: 0; padding: 10px; box-sizing: border-box; }
        .box { width: 100%; max-width: 500px; display: flex; flex-direction: column; height: 90vh; box-sizing: border-box; }
        #login-screen { background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 0 10px rgba(0,255,102,0.2); border-radius: 6px; padding: 25px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; margin: auto; }
        .fld { background: #222226; border: 1px solid #444; color: var(--text); padding: 10px; border-radius: 6px; font-family: inherit; outline: none; font-size: 16px; }
        .fld:focus { border-color: var(--accent); }
        #chat-screen { display: none; }
        #chat-header { display: flex; justify-content: space-between; background: var(--panel); border: 1px solid var(--accent); border-bottom: none; border-top-left-radius: 6px; border-top-right-radius: 6px; padding: 10px; font-weight: bold; color: var(--accent); }
        #pinned-welcome { background: #261c20; border-left: 3px solid #ff0055; border-right: 1px solid var(--accent); padding: 10px; font-size: 13px; display: flex; justify-content: space-between; }
        #window { flex: 1; background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 0 10px rgba(0,255,102,0.1); border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; padding: 15px; overflow-y: auto; margin-bottom: 12px; }
        .msg { background: #222226; padding: 8px; border-radius: 6px; margin-bottom: 8px; border-left: 3px solid var(--accent); word-break: break-word; white-space: pre-wrap; }
        .msg.sys { border-left: 3px solid #ff0055; background: #261c20; }
        .tm { color: #666; font-size: 11px; margin-bottom: 3px; display: flex; justify-content: space-between; }
        .nm { color: var(--accent); font-weight: bold; }
        #controls { display: flex; gap: 8px; }
        textarea { flex: 1; background: var(--panel); border: 1px solid var(--accent); color: var(--text); padding: 10px; border-radius: 6px; resize: none; font-family: inherit; outline: none; height: 20px; font-size: 16px; }
        button { background: var(--accent); color: #000; border: none; padding: 10px 15px; border-radius: 6px; font-family: inherit; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="margin:0;text-align:center;color:var(--accent)">Cx-Chat</h2>
        <input type="text" id="un" class="fld" placeholder="Никнейм" maxlength="20">
        <button id="lbtn" onclick="login()">Войти</button>
    </div>

    <div id="chat-screen" class="box">
        <div id="chat-header"><span id="title">🔴 Cx-Chat (main)</span><span id="on">Соединение...</span></div>
        <div id="pinned-welcome"><span style="color:#ff0055;font-weight:bold;">СИСТЕМА: <span style="color:var(--text);font-weight:normal;">Добро пожаловать</span></span><span id="wt" style="color:#666;font-size:11px;">--:--</span></div>
        <div id="window"></div>
        <div id="controls"><textarea id="in" placeholder="Сообщение..."></textarea><button id="sbtn" onclick="send()">-></button></div>
    </div>

    <script>
        let nick = '', room = 'main', ws = null;

        const getTm = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        function addMsg(sender, text, time, isSys = false) {
            if (isSys && text === 'Добро пожаловать') { document.getElementById('wt').textContent = time || getTm(); return; }
            const div = document.createElement('div');
            div.className = isSys ? 'msg sys' : 'msg';
            div.innerHTML = `<div class="tm"><span class="nm">${isSys ? sender : 'u/' + sender}</span><span>${time || getTm()}</span></div><div></div>`;
            div.querySelector('div:not(.tm)').textContent = text;
            document.getElementById('window').appendChild(div);
            document.getElementById('window').scrollTop = document.getElementById('window').scrollHeight;
        }

        window.onload = () => {
            if (localStorage.getItem('chat_nick')) {
                nick = localStorage.getItem('chat_nick');
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                connectToServer();
            }
        };

        function login() {
            nick = document.getElementById('un').value.trim();
            if (!nick) return alert('Введите никнейм!');
            localStorage.setItem('chat_nick', nick);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            connectToServer();
        }

        function connectToServer() {
            const tunnelURL = "mighty-tigers-thank.loca.lt"; 
            ws = new WebSocket('wss://' + tunnelURL);
            
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'login', sender: nick }));
            };
            
            ws.onmessage = (e) => {
                const res = JSON.parse(e.data);
                if (res.type === 'login_status' && !res.success) { alert(res.info); logout(); }
                else if (res.type === 'online') document.getElementById('on').textContent = 'В сети: ' + res.count;
                else if (res.type === 'msg') addMsg(res.sender, res.text, res.time, res.isSystem);
                else if (res.type === 'history') {
                    document.getElementById('window').innerHTML = '';
                    res.data.forEach(m => addMsg(m.sender, m.text, m.time, m.isSystem));
                }
            };
            ws.onclose = () => { setTimeout(connectToServer, 3000); };
        }

        function logout() { localStorage.removeItem('chat_nick'); if (ws) ws.close(); location.reload(); }

        function send() {
            const txt = document.getElementById('in').value.trim();
            if (!txt || ws.readyState !== 1) return;
            document.getElementById('in').value = '';

            if (txt.startsWith('/')) {
                const idx = txt.indexOf(' '), cmd = idx !== -1 ? txt.substring(0, idx) : txt, arg = idx !== -1 ? txt.substring(idx + 1).trim() : '';
                if (cmd === '/room') {
                    if (!arg) return alert('Укажите имя комнаты!');
                    room = arg;
                    document.getElementById('title').textContent = '🔴 Cx-Chat (' + arg + ')';
                    ws.send(JSON.stringify({ type: 'join_room', room: arg }));
                } else if (cmd === '/clear') {
                    ws.send(JSON.stringify({ type: 'command', text: '/clear' }));
                }
                return;
            }
            ws.send(JSON.stringify({ type: 'msg', text: txt }));
        }

        document.getElementById('in').addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    </script>
</body>
</html>
